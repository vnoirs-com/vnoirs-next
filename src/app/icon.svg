<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="vnoirs-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14192b"/>
      <stop offset="100%" stop-color="#080c16"/>
    </linearGradient>
    <linearGradient id="vnoirs-v" x1="6" y1="6" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="vnoirs-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle backdrop -->
  <rect width="32" height="32" rx="8" fill="url(#vnoirs-bg)" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.45"/>
  <rect x="1.5" y="1.5" width="29" height="29" rx="6.5" stroke="#a855f7" stroke-width="0.6" stroke-opacity="0.3"/>

  <!-- Glowing V monogram -->
  <path d="M7 9.5H11.2L16 19.8L20.8 9.5H25L17.8 23.8C17.0 25.4 15.0 25.4 14.2 23.8L7 9.5Z" fill="url(#vnoirs-v)" filter="url(#vnoirs-glow)"/>

  <!-- High-tech cyan signal node -->
  <circle cx="23.5" cy="8.5" r="2.2" fill="#38bdf8" />
  <circle cx="23.5" cy="8.5" r="1" fill="#ffffff" />
</svg>
